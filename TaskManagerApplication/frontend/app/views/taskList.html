<div class="page">
    <div class="page-header">
        <h2>Tasks</h2>
    </div>

    <div class="filter-bar">
        <label class="filter-bar-label">Search
            <input class="filter-bar-input" type="text" ng-model="taskList.filters.search" ng-change="taskList.applyFilters()" placeholder="Title or description">
        </label>
        <label class="filter-bar-label">Status
            <select class="filter-bar-select" ng-model="taskList.filters.status" ng-change="taskList.applyFilters()">
                <option value="">All</option>
                <option ng-repeat="s in taskList.statusOptions" value="{{ s }}">{{ s }}</option>
            </select>
        </label>
        <label class="filter-bar-label">Priority
            <select class="filter-bar-select" ng-model="taskList.filters.priority" ng-change="taskList.applyFilters()">
                <option value="">All</option>
                <option ng-repeat="p in taskList.priorityOptions" value="{{ p }}">{{ p }}</option>
            </select>
        </label>
        <label class="filter-bar-label filter-bar-label-right">Sort by
            <select class="filter-bar-select" ng-model="taskList.sort.SortBy" ng-change="taskList.applyFilters()">
                <option value="">None</option>
                <option value="dueAt">Due Date</option>
                <option value="priority">Priority</option>
            </select>
        </label>
    </div>

    <p class="alert alert-error" ng-if="taskList.errorMessage">{{ taskList.errorMessage }}</p>

    <div class="task-grid">
        <div class="task-card task-card-{{ taskList.priorityClasses[task.priority] }}" ng-repeat="task in taskList.tasks">
            <div class="task-card-header">
                <h3 class="task-card-title">{{ task.title }}</h3>
                <span class="badge badge-{{ taskList.statusClasses[task.status] }}">{{ taskList.statusLabels[task.status] }}</span>
            </div>
            <p class="task-card-description">{{ task.description }}</p>
            <div class="task-card-meta">
                <span class="badge badge-{{ taskList.priorityClasses[task.priority] }}">{{ taskList.priorityLabels[task.priority] }}</span>
                <span>Due {{ task.dueAt | date:'shortDate' }}</span>
            </div>
            <div class="task-card-owner" ng-if="taskList.isAdmin && !taskList.viewingUserId">Owner: {{ taskList.userMap[task.userId] || 'Unknown' }}</div>
            <div class="task-card-actions">
                <a class="btn btn-small btn-icon" ng-if="!taskList.isAdmin" href="#/tasks/{{ task.id }}/edit" title="Edit" aria-label="Edit">
                    <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                </a>
                <button class="btn btn-small btn-danger btn-icon" ng-if="!taskList.isAdmin" ng-click="taskList.deleteTask(task.id)" title="Delete" aria-label="Delete">
                    <svg viewBox="0 0 24 24"><path d="M6 7h12l-1 14H7L6 7zm3-3h6l1 2H8l1-2zM5 6h14v2H5V6z"/></svg>
                </button>
            </div>
        </div>
    </div>
</div>
