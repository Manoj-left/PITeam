<div class="page">
    <div class="page-header">
        <h1>Users</h1>
    </div>
    
    <div class="filter-bar">
        <label class="filter-bar-label">Search
            <input class="filter-bar-input" type="text" ng-model="userList.search" ng-change="userList.runSearch()" placeholder="Username">
        </label>
    </div>

    <p class="alert alert-error" ng-if="userList.errorMessage">{{ userList.errorMessage }}</p>

    <table class="table">
        <thead>
            <tr>
                <th>Username</th>
                <th>Role</th>
                <th>Tasks</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr ng-repeat="user in userList.users">
                <td>{{ user.username }}</td>
                <td>{{ userList.roleLabels[user.role] }}</td>
                <td>{{ user.taskCount }}</td>
                <td>
                    <div class="table-actions">
                        <a class="btn btn-small" href="#/tasks?userId={{ user.id }}">View Tasks</a>
                        <button class="btn btn-small btn-danger btn-icon" ng-click="userList.deleteUser(user.id)" title="Delete" aria-label="Delete">
                            <svg viewBox="0 0 24 24"><path d="M6 7h12l-1 14H7L6 7zm3-3h6l1 2H8l1-2zM5 6h14v2H5V6z"></path></svg>
                        </button>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>
    <p class="alert alert-info" ng-if="!userList.errorMessage && userList.users.length === 0">No users to display</p>
</div>
<body></body>
