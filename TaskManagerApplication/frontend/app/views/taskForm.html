<div class="page">
    <div class="form-card">
        <h2>{{ taskForm.isEditMode ? 'Edit Task' : 'New Task' }}</h2>

        <p class="alert alert-error" ng-if="taskForm.errorMessage">{{ taskForm.errorMessage }}</p>

        <form ng-submit="taskForm.save()">
            <label class="form-group">Title
                <input class="form-input" type="text" ng-model="taskForm.task.title" required>
            </label>
            <label class="form-group">Description
                <textarea class="form-textarea" ng-model="taskForm.task.description"></textarea>
            </label>
            <label class="form-group">Due Date
                <input class="form-input" type="date" ng-model="taskForm.task.dueAt" ng-model-options="{timezone: 'utc'}" required>
            </label>
            <label class="form-group">Priority
                <select class="form-select" ng-model="taskForm.task.priority">
                    <option ng-value="0">Low</option>
                    <option ng-value="1">Medium</option>
                    <option ng-value="2">High</option>
                </select>
            </label>
            <label class="form-group" ng-if="taskForm.isEditMode">Status
                <select class="form-select" ng-model="taskForm.task.status">
                    <option ng-value="0">Not Started</option>
                    <option ng-value="1">In Progress</option>
                    <option ng-value="2">Completed</option>
                    <option ng-value="3">On Hold</option>
                </select>
            </label>

            <div class="form-actions">
                <button class="btn" type="submit">Save</button>
                <a href="#/tasks">Cancel</a>
            </div>
        </form>
    </div>
</div>
<body></body>
