<div class="auth-page">
    <section class="auth-hero">
        <h1 class="auth-hero-title">Get started!</h1>
    
    </section>

    <div class="form-card auth-card">
        <h2>Register</h2>

        <p class="alert alert-error" ng-if="register.errorMessage">{{ register.errorMessage }}</p>

        <form ng-submit="register.submit()">
            <label class="form-group">Username
                <input class="form-input" type="text" ng-model="register.credentials.username" required>
            </label>
            <label class="form-group">Password
                <input class="form-input" type="password" ng-model="register.credentials.password" required>
            </label>
            <div class="form-actions">
                <button class="btn" type="submit">Register</button>
            </div>
        </form>

        <p class="form-footer"><a href="#/login">Already have an account? Login</a></p>
    </div>
</div>
<body></body>
