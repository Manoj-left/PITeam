<div>
    <h2>Login</h2>

    <p ng-if="login.errorMessage">{{ login.errorMessage }}</p>

    <form ng-submit="login.submit()">
        <label>Username:
            <input type="text" ng-model="login.credentials.username" required>
        </label>
        <label>Password:
            <input type="password" ng-model="login.credentials.password" required>
        </label>
        <button type="submit">Login</button>
    </form>

    <a href="#!/register">Need an account? Register</a>
</div>
