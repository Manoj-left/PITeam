<div class="auth-page">
    <section class="auth-hero">
        <h1 class="auth-hero-title">Welcome Back!</h1>
        
    </section>

    <div class="form-card auth-card">
        <h2>Login</h2>

        <p class="alert alert-error" ng-if="login.errorMessage">{{ login.errorMessage }}</p>

        <form ng-submit="login.submit()">
            <label class="form-group">Username
                <input class="form-input" type="text" ng-model="login.credentials.username" required>
            </label>
            <label class="form-group">Password
                <input class="form-input" type="password" ng-model="login.credentials.password" required>
            </label>
            <div class="form-actions">
                <button class="btn" type="submit">Login</button>
            </div>
        </form>

        <p class="form-footer"><a href="#/register">Need an account? Register</a></p>
    </div>
</div>
<body></body>
